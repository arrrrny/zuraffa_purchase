name: zuraffa_subscriptions
description: >-
  Typed in-app purchases and subscriptions for the Zuraffa ecosystem: a
  scriptable store port behind a service that maps transactions into
  derived entitlements.
version: 7.3.8
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  get_it: ^9.3.0
  json_annotation: ^4.12.0
  zorphy_annotation: ^2.4.3
  zuraffa: ^7.3.8

dev_dependencies:
  build_runner: ^2.16.2
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mutation_test: ^1.8.1
  test: ^1.33.0

repository: https://github.com/arrrrny/zuraffa_subscriptions
issue_tracker: https://github.com/arrrrny/zuraffa_subscriptions/issues

topics:
  - subscriptions
  - in-app-purchase
  - entitlements
  - clean-architecture
  - zuraffa

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0

  zuraffa:
    path: ../../../zuraffa
