# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: zuraffa_purchase
description: >-
  Purchase support for the Zuraffa ecosystem: a typed in-app purchase port behind a
  service, with the StoreKit / Play Billing adapters shipped as federated siblings.
version: 7.3.2
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  zuraffa: ^7.3.2
  # The subscription seam this package adapts: `SubscriptionStorePort` is the
  # contract `PurchaseSubscriptionStore` implements, so a consuming app can hand
  # a real store straight to `SubscriptionService`. The dependency is one-way —
  # `zuraffa_subscriptions` pulls in no purchase package, so the family stays
  # acyclic.
  zuraffa_subscriptions: ^7.3.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
  # The locator the DI registration is written against.
  get_it: ^9.3.0
  # The mutation audit the `zfa tdd verify` gate runs over the production
  # surface (scoped by mutation-test.xml).
  mutation_test: ^1.8.1

  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  coverage: ^1.15.1
repository: https://github.com/arrrrny/zuraffa_purchase
issue_tracker: https://github.com/arrrrny/zuraffa_purchase/issues

topics:
  - purchase
  - clean-architecture
  - zuraffa


# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0
  zuraffa_subscriptions:
    path: ../../../zuraffa_subscriptions/packages/zuraffa_subscriptions

  zuraffa:
    path: ../../../zuraffa
