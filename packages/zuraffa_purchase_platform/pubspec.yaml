# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: zuraffa_purchase_platform
description: >-
  Shared store core for the zuraffa_purchase platform adapters: the StoreApi contract,
  the in_app_purchase-backed implementation, and the shared purchase/restore flow.
version: 0.1.1
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  zuraffa_purchase: ^0.1.1
  # The store plugin this family wraps: StoreKit on macOS/iOS (via
  # in_app_purchase_storekit), Play Billing on Android.
  in_app_purchase: ^3.3.1
  # Pinned past 0.4.13 so the app's build is free of the StoreKit 1
  # deprecation warnings — `in_app_purchase` allows any 0.4.x, so the
  # constraint is what actually holds the version.
  in_app_purchase_storekit: ^0.4.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

dependency_overrides:
  # Local development only — resolve the app-facing package to this
  # checkout; stripped on publish.
  zuraffa_purchase:
    path: ../zuraffa_purchase

repository: https://github.com/arrrrny/zuraffa_purchase
issue_tracker: https://github.com/arrrrny/zuraffa_purchase/issues

topics:
  - purchase
  - in-app-purchase
  - zuraffa
