# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: zuraffa_purchase_platform
description: >-
  Shared store core for the zuraffa_purchase platform adapters: the StoreApi contract,
  the in_app_purchase-backed implementation, and the shared purchase/restore flow.
version: 7.2.0
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  zuraffa_purchase: ^0.1.1
  # The store plugin this family wraps: StoreKit on macOS/iOS (via
  # in_app_purchase_storekit), Play Billing on Android. The native
  # implementation is pinned by the adapter that owns it — the Apple
  # adapters pin in_app_purchase_storekit — so the shared core does not
  # pull a native plugin an Android consumer can never use.
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  # The plugin's platform interface — the seam the store plugin itself is
  # driven through, and the only way to fake it in a test.
  in_app_purchase_platform_interface: ^1.4.1

dependency_overrides:
  # Local development only — resolve the app-facing package to this
  # checkout; stripped on publish.
  zuraffa_purchase:
    path: ../zuraffa_purchase

  xml: 7.1.0
repository: https://github.com/arrrrny/zuraffa_purchase
issue_tracker: https://github.com/arrrrny/zuraffa_purchase/issues

topics:
  - purchase
  - in-app-purchase
  - zuraffa
