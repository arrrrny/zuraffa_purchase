# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: zuraffa_purchase_android
description: >-
  Android adapter for zuraffa_purchase — the Play Billing store behind a typed port,
  reached through package:in_app_purchase.
version: 0.1.0
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  zuraffa: ^7.1.0
  zuraffa_purchase: ^0.1.0
  zuraffa_purchase_platform: ^0.1.0
  # The native Play Billing implementation, bundled with the app.
  in_app_purchase_android: ^0.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

dependency_overrides:
  # Local development only — resolve the in-family siblings to this
  # checkout; stripped on publish.
  zuraffa_purchase:
    path: ../zuraffa_purchase
  zuraffa_purchase_platform:
    path: ../zuraffa_purchase_platform

repository: https://github.com/arrrrny/zuraffa_purchase
issue_tracker: https://github.com/arrrrny/zuraffa_purchase/issues

topics:
  - purchase
  - in-app-purchase
  - play-billing
  - zuraffa
